<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de temperatura</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #eaf2f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .panel {
        background: white;
        width: 340px;
        padding: 30px;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 5px 20px #0002;
    }

    h2 {
        color: #263238;
    }

    .icono {
        font-size: 55px;
    }

    #temperatura {
        font-size: 48px;
        font-weight: bold;
        color: #e65100;
        margin: 25px 0;
    }

    button {
        background: #1976d2;
        color: white;
        border: none;
        padding: 14px 25px;
        border-radius: 8px;
        font-size: 17px;
        cursor: pointer;
    }

    button:hover {
        background: #0d47a1;
    }

    #mensaje {
        color: #666;
        margin-top: 20px;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="panel">

    <h2>Monitor de temperatura ALEXIS</h2>

    <div class="icono">🌡️</div>

    <div id="temperatura">-- °C</div>

    <button id="boton" onclick="leerTemperatura()">
        Leer temperatura
    </button>

    <div id="mensaje">Esperando consulta...</div>

</div>

<script>

async function leerTemperatura() {

    const temperatura = document.getElementById("temperatura");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("boton");

    boton.disabled = true;
    temperatura.innerHTML = "-- °C";
    mensaje.innerHTML = "Consultando sensor...";

    const url = "https://cygnus.uniajc.edu.co/appis/ldispositivo.php?id=243&c=temp123";

    try {

        const respuesta = await fetch(url);

        if (!respuesta.ok) {
            throw new Error("Error HTTP " + respuesta.status);
        }

        const dato = await respuesta.text();

        // Extraer el valor numérico recibido
        const valor = dato.match(/-?\d+(?:[.,]\d+)?/);

        if (!valor) {
            throw new Error("No se encontró un valor de temperatura");
        }

        const grados = parseFloat(valor[0].replace(",", "."));

        temperatura.innerHTML = grados.toFixed(1) + " °C";
        mensaje.innerHTML = "Última lectura: " + new Date().toLocaleTimeString();

    } catch (error) {

        mensaje.innerHTML = "Error al consultar el sensor";
        console.error(error);

    } finally {
        boton.disabled = false;
    }
}

</script>

</body>
</html>
